name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  being-worker:
    name: being-worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: being-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: being-worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  being-mcp-server:
    name: being-mcp-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: being-mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: being-mcp-server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
